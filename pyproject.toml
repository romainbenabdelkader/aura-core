[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-core"
version = "0.1.0"
description = "Minimal AURA implementation primitives for manifest hashing, signing and verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Romain Benabdelkader" }
]
dependencies = [
  "cryptography>=41"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aura_core*"]
